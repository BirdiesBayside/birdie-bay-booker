name: Build Windows Installer
# Build v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build TAPO control executable
        working-directory: ./electron
        run: |
          pip install pyinstaller tapo
          pyinstaller --onefile --distpath . --workpath build_temp --specpath build_temp --clean --noconfirm tapo_control.py
          Remove-Item -Recurse -Force build_temp -ErrorAction SilentlyContinue

      - name: Install web app dependencies
        run: npm ci

      - name: Build bay controller app
        run: npx vite build --config vite.config.electron.ts

      - name: Install Electron dependencies
        working-directory: ./electron
        run: npm install

      - name: Build Windows installer
        working-directory: ./electron
        run: npm run build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirdiesBayController-Windows
          path: electron/dist-electron/*.exe
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Bay Controller Build ${{ github.run_number }}
          files: electron/dist-electron/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
