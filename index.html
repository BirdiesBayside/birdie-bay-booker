<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- index.html is served with no-cache by the host, so the browser always revalidates
         the shell while hashed /assets/* files keep their long-lived immutable caching.
         Do NOT add no-store here: some mobile browsers extend it to the JS/CSS bundles,
         forcing a full re-download on every visit. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Birdies Bayside | Indoor Golf, Redland Bay</title>
    <meta data-rh="true" name="description" content="Birdies is a premium indoor golf venue in Redland Bay. Book a simulator bay, play world-famous courses, join the league, or grab a drink at the Birdies Bar.">
    <meta name="author" content="Birdies Bayside" />

    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/52nWEipXV4WatotNhK1o0pvVE3I2/social-images/social-1782476725096-BIRDIES_AMENDED-9.7.25-01.webp">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Birdies" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/52nWEipXV4WatotNhK1o0pvVE3I2/social-images/social-1782476725096-BIRDIES_AMENDED-9.7.25-01.webp">

    <!-- Google Fonts: Anton for headers, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    
  
  
  
  
  <link rel="icon" type="image/png" href="/favicon.png">
