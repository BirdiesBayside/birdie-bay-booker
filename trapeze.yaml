platforms:
  ios:
    targets:
      App:
        plist:
          replace: false
          entries:
            - CFBundleURLTypes:
                - CFBundleURLName: com.birdiesbayside.hub
                  CFBundleURLSchemes:
                    - birdiesbayside
            - NSPhotoLibraryAddUsageDescription: Birdies saves exported highlight videos to your Photos library.
            - NSPhotoLibraryUsageDescription: Birdies uses photo library access only when you save highlight videos.
  android:
    manifest:
      - file: AndroidManifest.xml
        target: manifest/application/activity
        inject: |
          <intent-filter>
            <action android:name="android.intent.action.VIEW" />
            <category android:name="android.intent.category.DEFAULT" />
            <category android:name="android.intent.category.BROWSABLE" />
            <data android:scheme="birdiesbayside" />
          </intent-filter>
